<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=421">
<title>Time · Analog ivory</title>
<link rel="stylesheet" href="style.css">
<style>:root{--design-width:320}</style><link rel="stylesheet" href="../../embed.css"><script src="../../freeze.js"></script><script src="../../embed.js" defer></script></head>
<body>
  <main class="preview">
    <section class="clock-widget">
      <div class="date"><span id="day">MON</span><span id="date">SEP 22</span></div>
      <div class="digital-hour" id="digital-hour">12</div>

      <div class="clock-face">
        <div class="marker marker-12">12</div>
        <div class="marker marker-3">3</div>
        <div class="marker marker-6">6</div>
        <div class="marker marker-9">9</div>
        <span class="tick t1"></span><span class="tick t2"></span>
        <span class="tick t4"></span><span class="tick t5"></span>
        <span class="tick t7"></span><span class="tick t8"></span>
        <span class="tick t10"></span><span class="tick t11"></span>
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="center-dot"></div>
      </div>

      <p class="caption">GOOD THINGS<br>TAKE TIME</p>
    </section>
  </main>
<script src="script.js"></script>
</body>
</html>
